<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nescafé Caramel Latte | Rich. Golden. Smooth.</title>
<meta name="description" content="Nescafé Caramel Latte — velvety espresso swirled with golden caramel. Hot or iced.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
:root {
    --text-color: #ffffff;
    --muted-color: rgba(255, 255, 255, 0.72);
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.12);
    --font-main: 'Inter', sans-serif;
    --font-heading: 'Galada', cursive;

    --bg-inner: #b06a2c;
    --bg-mid: #5c3316;
    --bg-outer: #1c0f06;

    --accent: #ffd9a0;
    --accent-text: #3a1f06;

    --cup-top: #ffe6bf;
    --cup-mid: #d99a4e;
    --cup-bottom: #7a4413;
    --sleeve: #4a2a12;
    --drizzle: #7a4413;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
    color: var(--text-color);
    font-family: var(--font-main);
    overflow: hidden;
    height: 100vh;
    transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body.iced-theme {
    --bg-inner: #2f5f73;
    --bg-mid: #163947;
    --bg-outer: #061418;
    --cup-top: #eaf6fa;
    --cup-mid: #bfe3ee;
    --cup-bottom: #7fb9cc;
    --sleeve: #12414f;
    --drizzle: #b06a2c;
}

/* Bubbles / foam */
#bubbles-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
}

.bubble {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0.05) 70%);
}

@keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.5; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
}

/* Header */
.header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2rem 4%; position: fixed; top: 0; width: 100%; z-index: 100;
}

.logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 1.3rem; font-family: var(--font-heading); }
.logo .sub { font-family: var(--font-main); font-size: 0.6rem; letter-spacing: 0.15em; color: var(--muted-color); display: block; }

.nav { display: flex; gap: 0.5rem; padding: 0.4rem; border-radius: 100px; }
.nav.glass {
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}
.nav-item {
    font-family: 'Manrope', sans-serif; color: var(--muted-color); text-decoration: none;
    font-size: 0.85rem; font-weight: 500; padding: 0.5rem 1.2rem; border-radius: 100px;
    transition: all 0.3s ease;
}
.nav-item:hover, .nav-item.active { background: var(--accent); color: var(--accent-text); }

.contact-btn {
    background: rgba(0, 0, 0, 0.5); color: white; border: none; padding: 0.9rem 2rem;
    border-radius: 100px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.3s ease;
}
.contact-btn:hover { background: rgba(0, 0, 0, 0.7); transform: translateY(-2px); }

/* Hero */
.hero { height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0 4%; padding-top: 5rem; }
.hero-content { display: flex; justify-content: space-between; align-items: stretch; width: 100%; height: 100%; position: relative; }

.main-title, .side-title {
    font-family: var(--font-heading); font-size: clamp(5rem, 10vw, 12rem);
    line-height: 0.8; font-weight: 400; white-space: nowrap; color: white;
}
.outline { color: var(--text-color); }

/* Steam wisps (far background, like leaves) */
.wisps-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: -1; transition: transform 0.1s ease-out;
}
.wisp { position: absolute; width: 60px; height: 60px; opacity: 0.35; filter: blur(0.5px); }
.w1 { top: 10%; left: 15%; } .w2 { top: 40%; left: 80%; width: 140px; height: 140px; opacity: 0.22; }
.w3 { top: 70%; left: 75%; width: 80px; height: 80px; } .w4 { top: 85%; left: 20%; width: 120px; height: 120px; opacity: 0.18; }

/* Left column */
.hero-left { display: flex; flex-direction: column; height: 100%; padding: 6rem 0; gap: 2rem; z-index: 100; }
.description { color: var(--muted-color); font-size: 1.1rem; line-height: 1.6; max-width: 400px; }

.primary-btn {
    display: flex; align-items: center; gap: 1.5rem; background: rgba(0, 0, 0, 0.5); color: white;
    border: none; padding: 0.4rem 0.4rem 0.4rem 1.5rem; border-radius: 100px; font-weight: 700;
    cursor: pointer; width: fit-content; transition: all 0.3s ease;
}
.primary-btn:hover { background: rgba(0, 0, 0, 0.7); transform: translateY(-3px); }

.plus-icon {
    background: var(--accent); color: var(--accent-text); width: 38px; height: 38px; display: flex;
    align-items: center; justify-content: center; border-radius: 50%; font-size: 1.4rem; font-weight: 900;
    line-height: 1; padding-bottom: 2px;
}

.award-badge { display: flex; align-items: center; gap: 1rem; margin-top: auto; }
.award-icon {
    width: 48px; height: 48px; background: var(--glass-bg); border: 1px solid var(--glass-border);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
}
.award-text { display: flex; flex-direction: column; }
.award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
.award-subtitle { font-size: 0.85rem; font-weight: 600; }

/* Drop containers (equivalent to berries) */
.drops-container {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 110; transition: transform 0.1s ease-out;
}
.drops-container-bg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; transition: transform 0.1s ease-out;
}
.drop {
    position: absolute; width: 120px; height: 120px;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
}
.d1 { top: 25%; left: 30%; width: 190px; height: 190px; }
.d2 { top: 60%; left: 42%; width: 90px; height: 90px; }
.d3 { top: 30%; left: 62%; width: 210px; height: 210px; }
.d4 { top: 15%; left: 48%; width: 120px; height: 120px; }
.d5 { top: 75%; left: 20%; width: 100px; height: 100px; }
.d6 { top: 45%; left: 75%; width: 150px; height: 150px; }
.d7 { top: 15%; left: 40%; width: 70px; height: 70px; opacity: 0.7; }
.d8 { top: 50%; left: 55%; width: 60px; height: 60px; opacity: 0.6; }
.d9 { top: 80%; left: 35%; width: 65px; height: 65px; opacity: 0.7; }

/* Center product (cup) */
.hero-center {
    display: flex; justify-content: center; align-items: center; position: absolute;
    top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0;
    animation: fadeIn 1.5s ease-out 0.3s forwards, floatCup 6s ease-in-out infinite;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(255, 200, 120, 0.12) 0%, transparent 70%);
    perspective: 1400px;
}
@keyframes fadeIn { to { opacity: 1; } }
@keyframes floatCup { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

.cup-wrap {
    width: 46vw; max-width: 480px; height: 70vh; max-height: 640px;
    position: fixed; top: 50%; left: 50%;
    transform-style: preserve-3d;
    transform: translate(-50%, -50%) rotate(-8deg);
    will-change: transform;
}
.cup-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cup-face { transition: opacity 0.15s linear; }
.cup-face.hidden { opacity: 0; pointer-events: none; }

/* Right column */
.hero-right {
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;
    text-align: right; height: 100%; padding: 6rem 0; z-index: 100; width: 450px; pointer-events: none;
}
.product-carousel { display: flex; flex-direction: column; gap: 1.5rem; align-items: flex-end; pointer-events: auto; }
.carousel-cards { display: flex; gap: 1rem; }

.card {
    background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 1rem; padding-top: 4rem;
    border-radius: 28px; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
    cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    width: 135px; position: relative; backdrop-filter: blur(10px); text-align: center;
}
.card:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); }
.card.active { border-color: var(--accent); border-width: 1px; background: var(--glass-bg); }

.card svg { width: 100px; height: 110px; margin-top: -6.5rem; display: block; pointer-events: none;
    filter: drop-shadow(0 16px 24px rgba(0,0,0,0.5));
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important; }
.card:hover svg { transform: translateY(-20px) rotate(-8deg) scale(1.1) !important; }

.card-info { display: flex; flex-direction: column; font-size: 0.7rem; width: 100%; }
.card-info span:first-child { font-weight: 600; }
.card-info span:last-child { color: var(--muted-color); }

.carousel-nav { display: flex; gap: 1rem; }
.nav-arrow {
    background: var(--glass-bg); border: 1px solid var(--glass-border); color: white; width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.3s;
}
.nav-arrow:hover { background: rgba(255, 255, 255, 0.1); }
.side-title { align-self: flex-end; text-align: right; }

@media (max-width: 1200px) {
    .cup-wrap { width: 70vw; height: 50vh; top: 42%; }
    .hero-content { flex-direction: column; padding-top: 8rem; }
    .hero-center { order: -1; }
    .main-title, .side-title { font-size: 5rem; }
    .hero-right { align-items: center; text-align: center; width: 100%; }
    .side-title { align-self: center; text-align: center; }
}
</style>
</head>
<body>

<div id="bubbles-container"></div>

<header class="header">
    <div class="logo">
        <span>Nescafé<span class="sub">CARAMEL LATTE</span></span>
    </div>
    <nav class="nav glass">

<!-- Hidden defs reused by mini cup icons in carousel cards -->
<svg style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true">
    <defs>
        <g id="miniCupHot">
            <ellipse cx="150" cy="70" rx="88" ry="20" fill="#f3e4cf"/>

        </g>
        <g id="miniCupIced">
            <path d="M75 90 L225 90 L200 390 Q150 405 100 390 Z" fill="url(#cupBody)" opacity="0.55"/>
            <path d="M75 90 L225 90 L200 390 Q150 405 100 390 Z" fill="none" stroke="#eaf6fa" stroke-width="3" opacity="0.7"/>
            <ellipse cx="150" cy="90" rx="75" ry="17" fill="#eaf6fa" opacity="0.5"/>
            <rect x="76" y="200" width="148" height="76" rx="10" fill="url(#sleeveGrad)"/>

                <rect x="100" y="120" width="34" height="30" rx="6" transform="rotate(-8 100 120)"/>

            </g>
            <rect x="140" y="20" width="14" height="90" rx="7" fill="#eaf6fa"/>

<script>
// ---- Drop shape template (caramel drop) ----
const DROP_SVG = `<svg viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="dropGrad{ID}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffe9c2"/>
            <stop offset="45%" stop-color="#d99a4e"/>
            <stop offset="100%" stop-color="#7a4413"/>
        </linearGradient>
    </defs>
    <path d="M50 6 C68 38 84 54 84 70 A34 34 0 1 1 16 70 C16 54 32 38 50 6 Z" fill="url(#dropGrad{ID})"/>
    <ellipse cx="39" cy="56" rx="9" ry="15" fill="#fff3de" opacity="0.55"/>
</svg>`;

document.querySelectorAll('.drop').forEach((el, i) => {
    el.innerHTML = DROP_SVG.replaceAll('{ID}', i);
    el.dataset.rx = 0; el.dataset.ry = 0; el.dataset.angle = Math.random() * 360;
    el.dataset.baseX = 0; el.dataset.baseY = 0;
});

const dropsFG = document.querySelector('.drops-container');
const dropsBG = document.querySelector('.drops-container-bg');
const wispsBG = document.querySelector('.wisps-container');
const allDrops = document.querySelectorAll('.drop');
const cupWrap = document.getElementById('cup-wrap');
const hotFace = document.querySelector('.hot-face');
const icedFace = document.querySelector('.iced-face');
const cards = document.querySelectorAll('.card');

let isSwitching = false;
let switchSpin = 0;
let currentMode = 'hot';

cards.forEach(card => {
    card.addEventListener('click', () => {
        if (isSwitching) return;
        const mode = card.dataset.mode;
        if (mode === currentMode) return;
        cards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        switchMode(mode);
    });
});

function switchMode(mode) {
    isSwitching = true;
    currentMode = mode;
    const body = document.body;

    const target = mode === 'iced' ?
        { inner: '#2f5f73', mid: '#163947', outer: '#061418' } :
        { inner: '#b06a2c', mid: '#5c3316', outer: '#1c0f06' };

    gsap.to(body, {
        '--bg-inner': target.inner, '--bg-mid': target.mid, '--bg-outer': target.outer,
        duration: 1.5, ease: 'power2.inOut'
    });

    if (mode === 'iced') body.classList.add('iced-theme');

    const spinObj = { val: 0, blur: 0 };
    gsap.to(spinObj, {
        val: 360, blur: 12, duration: 0.6, ease: "power2.in",
        onUpdate: () => { switchSpin = spinObj.val; cupWrap.style.filter = `blur(${spinObj.blur}px)`; },
        onComplete: () => {
            hotFace.classList.toggle('hidden', mode !== 'hot');
            icedFace.classList.toggle('hidden', mode !== 'iced');
            if (mode !== 'iced') body.classList.remove('iced-theme');

            gsap.to(spinObj, {
                val: 720, blur: 0, duration: 1.5, ease: "back.out(0.7)",
                onUpdate: () => { switchSpin = spinObj.val; cupWrap.style.filter = `blur(${spinObj.blur}px)`; },
                onComplete: () => { switchSpin = 0; cupWrap.style.filter = 'none'; }
            });
        }
    });

    // Drops implode/explode
    let completed = 0;
    allDrops.forEach((drop, i) => {
        const dW = drop.offsetWidth / 2, dH = drop.offsetHeight / 2;
        const centerX = (window.innerWidth / 2 - drop.offsetLeft - dW);
        const centerY = (window.innerHeight / 2 - drop.offsetTop - dH);
        const startAngle = parseFloat(drop.dataset.angle) || 0;
        const curX = parseFloat(drop.dataset.baseX) || 0;
        const curY = parseFloat(drop.dataset.baseY) || 0;
        const nextX = (Math.random() - 0.5) * 200;
        const nextY = (Math.random() - 0.5) * 200;

        gsap.set(drop, { rotation: startAngle, x: curX, y: curY });

        gsap.timeline()
            .to(drop, {
                x: centerX, y: centerY, rotation: startAngle + 45, scale: 0.1, opacity: 0,
                duration: 0.5, ease: "power2.in"
            })
            .to(drop, { duration: 0.3 })
            .to(drop, {
                x: nextX, y: nextY, rotation: startAngle + 90, scale: 1, opacity: 1,
                duration: 0.9, ease: "back.out(1.5)",
                onComplete: () => {
                    drop.dataset.angle = startAngle + 90;
                    drop.dataset.baseX = nextX; drop.dataset.baseY = nextY;
                    drop.dataset.rx = 0; drop.dataset.ry = 0;
                    completed++;
                    if (completed === allDrops.length) isSwitching = false;
                }
            });
    });
}

let mouse = { x: 0, y: 0, px: 0, py: 0 };
let currentMouse = { x: 0, y: 0 };

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) - 0.5;
    mouse.y = (e.clientY / window.innerHeight) - 0.5;
    mouse.px = e.clientX; mouse.py = e.clientY;
});

function animate() {
    const time = Date.now() * 0.001;
    currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
    currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

    cupWrap.style.transform = `translate(-50%, -50%) rotate(-8deg) rotateY(${currentMouse.x * 40}deg) rotateX(${-currentMouse.y * 20}deg) rotateZ(${switchSpin}deg)`;

    dropsFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
    dropsBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
    wispsBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;

    if (!isSwitching) {
        allDrops.forEach((drop, i) => {
            const rect = drop.getBoundingClientRect();
            const dx = rect.left + rect.width / 2, dy = rect.top + rect.height / 2;
            const diffX = mouse.px - dx, diffY = mouse.py - dy;
            const distance = Math.sqrt(diffX * diffX + diffY * diffY);

            let targetRx = 0, targetRy = 0, speedMult = 1;
            if (distance < 400 && distance > 0) {
                const force = (400 - distance) / 400;
                targetRx = (diffX / distance) * force * -80;
                targetRy = (diffY / distance) * force * -80;
                speedMult = 1 + force * 5;
            }

            let rx = parseFloat(drop.dataset.rx) || 0;
            let ry = parseFloat(drop.dataset.ry) || 0;
            let angle = parseFloat(drop.dataset.angle) || 0;
            let baseX = parseFloat(drop.dataset.baseX) || 0;
            let baseY = parseFloat(drop.dataset.baseY) || 0;

            rx += (targetRx - rx) * 0.1;
            ry += (targetRy - ry) * 0.1;
            angle += 0.2 * speedMult;

            drop.dataset.rx = rx; drop.dataset.ry = ry; drop.dataset.angle = angle;

            const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
            const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
            const floatY = Math.sin(phase) * 15;
            const floatAngle = Math.cos(phase) * 6;

            drop.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
        });
    }

    document.querySelectorAll('.wisp').forEach((wisp, i) => {
        const dur = 10 + i * 2;
        const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
        const floatY = Math.sin(phase) * 20;
        const floatX = Math.cos(phase * 0.5) * 15;
        const floatAngle = Math.sin(phase * 0.3) * 15;
        wisp.style.transform = `translate(${floatX}px, ${floatY}px) rotate(${floatAngle}deg)`;
    });

    requestAnimationFrame(animate);
}
animate();

const bubblesContainer = document.getElementById('bubbles-container');
function createBubble() {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 16 + 8;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.bottom = '-50px';
    const duration = Math.random() * 6 + 4;
    bubble.style.animation = `floatUp ${duration}s linear forwards`;
    bubblesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), duration * 1000);
}
setInterval(createBubble, 400);
</script>
